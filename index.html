<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NEMA Receptacle SVG Preview</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #111; }
    h1, h2 { margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 0 0 28px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; }
    .card img { width: 130px; height: 130px; }
    .label { margin-top: 8px; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <h1>NEMA receptacle SVG preview</h1>

  <h2>Straight-blade receptacles</h2>
  <div class="grid">
    <div class="card"><img src="standard/nema-5-15r.svg" alt="NEMA 5-15R"/><div class="label">NEMA 5-15R</div></div>
    <div class="card"><img src="standard/nema-6-15r.svg" alt="NEMA 6-15R"/><div class="label">NEMA 6-15R</div></div>
    <div class="card"><img src="standard/nema-5-20r.svg" alt="NEMA 5-20R"/><div class="label">NEMA 5-20R</div></div>
    <div class="card"><img src="standard/nema-6-20r.svg" alt="NEMA 6-20R"/><div class="label">NEMA 6-20R</div></div>
  </div>

  <h2>Locking receptacles</h2>
  <div class="grid">
    <div class="card"><img src="locking/nema-l15-15r.svg" alt="NEMA L15-15R"/><div class="label">NEMA L15-15R</div></div>
    <div class="card"><img src="locking/nema-l6-15r.svg" alt="NEMA L6-15R"/><div class="label">NEMA L6-15R</div></div>
    <div class="card"><img src="locking/nema-l15-20r.svg" alt="NEMA L15-20R"/><div class="label">NEMA L15-20R</div></div>
    <div class="card"><img src="locking/nema-l5-20r.svg" alt="NEMA L5-20R"/><div class="label">NEMA L5-20R</div></div>
    <div class="card"><img src="locking/nema-l6-20r.svg" alt="NEMA L6-20R"/><div class="label">NEMA L6-20R</div></div>
    <div class="card"><img src="locking/nema-l5-30r.svg" alt="NEMA L5-30R"/><div class="label">NEMA L5-30R</div></div>
    <div class="card"><img src="locking/nema-l6-30r.svg" alt="NEMA L6-30R"/><div class="label">NEMA L6-30R</div></div>
  </div>
</body>
</html>
