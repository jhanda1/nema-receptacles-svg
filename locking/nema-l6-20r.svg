<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NEMA L6-20R receptacle">
  <title>NEMA L6-20R receptacle</title>
  <g>
    <circle cx="256" cy="190" r="152" fill="#fff" stroke="#111" stroke-width="10"/>
    <circle cx="256" cy="190" r="132" fill="none" stroke="#111" stroke-width="2"/>
    <!-- Three curved crescent slots around center (arc radius 72). Hots upper-left and right, ground bottom-left with a short radial tab. -->
    <!-- Upper hot crescent (~ -120deg to -60deg) -->
    <path d="M 220.0 120.6 A 72.0 72.0 0 0 1 292.0 120.6 L 292.0 136.6 A 56.0 56.0 0 0 0 220.0 136.6 Z" fill="#111"/>
    <!-- Right ground crescent with short radial locking tab at its lower end -->
    <path d="M 325.0 158.0 A 72.0 72.0 0 0 1 311.0 243.0 L 300.3 231.1 A 56.0 56.0 0 0 0 311.1 165.9 Z" fill="#111"/>
    <rect x="300.0" y="231.0" width="26.0" height="15.0" rx="6.0" fill="#111"/>
    <!-- Lower-left hot crescent -->
    <path d="M 201.0 243.0 A 72.0 72.0 0 0 1 187.0 158.0 L 200.9 165.9 A 56.0 56.0 0 0 0 211.7 231.1 Z" fill="#111"/>
  </g>
  <text x="256" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111">NEMA L6-20R</text>
</svg>
