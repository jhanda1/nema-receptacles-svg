<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NEMA 6-20R receptacle">
  <title>NEMA 6-20R receptacle</title>
  <g>
    <circle cx="256" cy="190" r="152" fill="#fff" stroke="#111" stroke-width="10"/>
    <circle cx="256" cy="190" r="132" fill="none" stroke="#111" stroke-width="2"/>
    <!-- Left: same T-slot as 5-20R with the bar centered and pointing outward -->
    <rect x="198.0" y="144.0" width="16.0" height="58.0" rx="7.0" fill="#111"/>
    <rect x="162.0" y="164.0" width="40.0" height="16.0" rx="7.0" fill="#111"/>
    <!-- Right: single horizontal slot, slightly wider for the correct 6-20R face -->
    <rect x="286.0" y="164.0" width="50.0" height="16.0" rx="7.0" fill="#111"/>
    <!-- D-shaped ground (flat top, rounded bottom) -->
    <path d="M 240.0 238.0 V 256.0 A 16.0 16.0 0 0 0 272.0 256.0 V 238.0 Z" fill="#111"/>
  </g>
  <text x="256" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111">NEMA 6-20R</text>
</svg>
