<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NEMA 5-15R receptacle">
  <title>NEMA 5-15R receptacle</title>
  <g>
    <circle cx="256" cy="190" r="152" fill="#fff" stroke="#111" stroke-width="10"/>
    <circle cx="256" cy="190" r="132" fill="none" stroke="#111" stroke-width="2"/>
    <!-- Two parallel vertical slots (neutral left slightly taller, hot right) -->
